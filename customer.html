<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coffee Shop - Order</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 16px; font-size: 1rem; width: 100%; cursor: pointer; }
  #confirmation { margin-top: 20px; padding: 12px; background: #e6f4ea; border-radius: 6px; display: none; }
  #confirmation.show { display: block; }

  .faq-section { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; }
  .faq-input-row { display: flex; gap: 8px; margin-top: 8px; }
  .faq-input-row input { flex: 1; }
  .faq-input-row button { width: auto; padding: 8px 16px; margin-top: 0; }
  .faq-answer { margin-top: 14px; padding: 12px; border-radius: 6px; font-size: 0.95rem; }
  .faq-answer.confident { background: #e6f4ea; }
  .faq-answer.unsure { background: #fdf3e6; color: #7a5b1e; }
  .faq-meta { margin-top: 6px; font-size: 0.75rem; color: #888; }
  .faq-loading { color: #888; font-style: italic; margin-top: 10px; }
</style>
</head>
<body>
  <h1>☕ Place Your Order</h1>
  <form id="order-form">
    <label for="customer">Name</label>
    <input id="customer" required>

    <label for="drink">Drink</label>
    <select id="drink">
      <option>latte</option>
      <option>cold brew</option>
      <option>cappuccino</option>
      <option>americano</option>
      <option>mocha</option>
      <option>drip coffee</option>
    </select>

    <label for="size">Size</label>
    <select id="size">
      <option>small</option>
      <option selected>medium</option>
      <option>large</option>
    </select>

    <label for="milk">Milk</label>
    <select id="milk">
      <option value="none">none</option>
      <option>whole</option>
      <option>oat</option>
      <option>almond</option>
      <option>soy</option>
    </select>

    <button type="submit">Place Order</button>
  </form>

  <div id="confirmation"></div>

  <div class="faq-section">
    <h2>💬 Ask a Question</h2>
    <p style="font-size:0.85rem; color:#666;">Try something like "Is the shop open on Sundays?" — powered by semantic search, not keyword matching.</p>
    <div class="faq-input-row">
      <input id="faq-input" type="text" placeholder="Ask about hours, menu, delivery, parking...">
      <button id="faq-submit">Ask</button>
    </div>
    <div id="faq-result"></div>
  </div>

  <script>
    const form = document.getElementById('order-form');
    const confirmation = document.getElementById('confirmation');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        customer: document.getElementById('customer').value,
        drink: document.getElementById('drink').value,
        size: document.getElementById('size').value,
        milk: document.getElementById('milk').value,
      };
      const res = await fetch('/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      confirmation.textContent = `✅ Order #${data.order_id} placed! Status: ${data.status}`;
      confirmation.classList.add('show');
      form.reset();
    });

    // --- FAQ chat box ---
    const faqInput = document.getElementById('faq-input');
    const faqSubmit = document.getElementById('faq-submit');
    const faqResult = document.getElementById('faq-result');

    async function askFaq() {
      const question = faqInput.value.trim();
      if (!question) return;

      faqResult.innerHTML = '<p class="faq-loading">Searching...</p>';

      try {
        const res = await fetch('/faq/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        if (data.confident) {
          faqResult.innerHTML = `
            <div class="faq-answer confident">
              ${data.answer}
              <div class="faq-meta">matched: "${data.matched_question}" · distance: ${data.distance.toFixed(3)}</div>
            </div>`;
        } else {
          faqResult.innerHTML = `
            <div class="faq-answer unsure">
              I'm not confident I have a good answer to that. Closest topic: "${data.matched_question ?? 'n/a'}"
              <div class="faq-meta">distance: ${data.distance !== null ? data.distance.toFixed(3) : 'n/a'} (above confidence threshold)</div>
            </div>`;
        }
      } catch (err) {
        faqResult.innerHTML = '<p class="faq-loading">Something went wrong - check the server logs.</p>';
      }
    }

    faqSubmit.addEventListener('click', askFaq);
    faqInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askFaq();
    });
  </script>
</body>
</html>
